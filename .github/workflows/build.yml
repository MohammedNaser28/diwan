name: Build Diwan

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allows manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Dependencies
        run: |
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "build-tools;29.0.3"

      - name: Install dependencies
        run: pnpm install

      - name: Build Android APK
        # Added --release flag so Gradle creates the release folder
        run: pnpm tauri android build --target aarch64

      - name: Find APK Directory
        id: find_apk
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          APK_DIR=$(dirname "$APK_PATH")
          echo "apk_dir=$APK_DIR" >> $GITHUB_OUTPUT
          echo "Found APK in $APK_DIR"

      - name: Sign Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ${{ steps.find_apk.outputs.apk_dir }}
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: diwan-android
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Produce patched Wayland-compatible AppImage
        shell: bash
        run: |
          set -euo pipefail

          APPDIR="src-tauri/target/release/bundle/appimage"
          ORIGINAL=$(ls "$APPDIR"/*.AppImage | head -1)
          VERSION="$(echo "$ORIGINAL" | sed -E 's/.*diwan_([0-9]+\.[0-9]+\.[0-9]+)_amd64\.AppImage/\1/')"
          echo "Original: $ORIGINAL (version $VERSION)"

          # ── 2. Extract ──────────────────────────────────────────────────
          cd "$APPDIR"
          chmod +x "$(basename "$ORIGINAL")"
          ./"$(basename "$ORIGINAL")" --appimage-extract > /dev/null 2>&1

          # ── 3. Patch GTK hook: remove the X11 lock ──────────────────────
          HOOK="squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          if [ -f "$HOOK" ]; then
            sed -i 's/^export GDK_BACKEND=x11/# export GDK_BACKEND=x11 # removed for Wayland compat/' "$HOOK"
            echo "Patched: $HOOK"
            grep -n "GDK_BACKEND" "$HOOK"
          else
            echo "WARNING: GTK hook not found at $HOOK"
            ls squashfs-root/apprun-hooks/ 2>/dev/null || true
          fi

          # ── 4. Repack with appimagetool ─────────────────────────────────
          cd /tmp
          APPIMAGETOOL="appimagetool-x86_64.AppImage"
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/$APPIMAGETOOL" -O "$APPIMAGETOOL"
          chmod +x "$APPIMAGETOOL"

          APPIMAGE_EXTRACT_AND_RUN=1 \
          ARCH=x86_64 \
          ./"$APPIMAGETOOL" \
            --no-appstream \
            "$GITHUB_WORKSPACE/$APPDIR/squashfs-root" \
            "$GITHUB_WORKSPACE/$APPDIR/diwan-${VERSION}_patched-x86_64.AppImage"

          echo "Patched AppImage created"
          ls -lh "$GITHUB_WORKSPACE/$APPDIR/diwan-${VERSION}_patched-x86_64.AppImage"

          # clean up
          rm -rf "$GITHUB_WORKSPACE/$APPDIR/squashfs-root" /tmp/$APPIMAGETOOL

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diwan-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diwan-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig

  release:
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Find signatures recursively in the downloaded artifacts
          LINUX_SIG_FILE=$(find diwan-linux -name "*.AppImage.sig" | head -n 1)
          WIN_SIG_FILE=$(find diwan-windows -name "*.msi.sig" | head -n 1)
          
          if [ -z "$LINUX_SIG_FILE" ]; then echo "Error: Linux signature not found"; exit 1; fi
          if [ -z "$WIN_SIG_FILE" ]; then echo "Error: Windows signature not found"; exit 1; fi
          
          LINUX_SIG=$(cat "$LINUX_SIG_FILE")
          WIN_SIG=$(cat "$WIN_SIG_FILE")
          
          # Construct JSON
          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "https://github.com/MohammedNaser28/diwan/releases/download/$GITHUB_REF_NAME/diwan_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://github.com/MohammedNaser28/diwan/releases/download/$GITHUB_REF_NAME/diwan_${VERSION}_x64_en-US.msi"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            diwan-android/**/*.apk
            diwan-linux/**/*.deb
            diwan-linux/**/*.AppImage
            diwan-windows/**/*.msi
            diwan-windows/**/*.exe
